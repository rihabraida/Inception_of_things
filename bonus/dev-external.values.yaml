# Generated by scripts/dev_dependencies.sh - do not commit this file.
# Use this values file when deploying the GitLab chart locally.
# See doc/development/external-dependencies.md for usage.

global:
  redis:
    host: "dev-valkey"
    auth:
      secret: "dev-valkey-auth"
      key: "default"
  psql:
    host: "dev-cluster-rw"
    password:
      secret: "dev-cluster-app"
      key: password
  appConfig:
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: dev-garage-gitlab-object-storage
        key: config
    artifacts:
      bucket: gitlab-artifacts
    lfs:
      bucket: git-lfs
    uploads:
      bucket: gitlab-uploads
    packages:
      bucket: gitlab-packages
    externalDiffs:
      enabled: true
      bucket: gitlab-mr-diffs
    terraformState:
      enabled: true
      bucket: gitlab-terraform-state
    ciSecureFiles:
      enabled: true
      bucket: gitlab-ci-secure-files
    agentPlanContent:
      enabled: true
      bucket: gitlab-agent-plan-content
    ciCatalogBundles:
      enabled: true
      bucket: gitlab-ci-catalog-bundles
    dependencyProxy:
      enabled: true
      bucket: gitlab-dependency-proxy

gitlab:
  toolbox:
    backups:
      objectStorage:
        config:
          secret: dev-garage-gitlab-object-storage-s3cmd
          key: config

registry:
  storage:
    secret: dev-garage-gitlab-registry-storage
    key: config
    redirect:
      disable: true
